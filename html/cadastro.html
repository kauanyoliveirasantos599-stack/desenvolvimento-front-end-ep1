<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cadastro - ONG Esperança</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- CABEÇALHO -->
    <header>

        <h1>ONG Esperança</h1>

        <nav>

            <!-- MENU MOBILE -->
            <button
                class="menu-toggle"
                type="button"
                aria-label="Abrir menu">
                ☰
            </button>

            <div class="menu-links">

                <a href="index.html">
                    Início
                </a>

                <a href="index.html#sobre">
                    Sobre nós
                </a>

                <div class="dropdown">

                    <a href="projetos.html">
                        Projetos
                    </a>

                    <div class="dropdown-content">

                        <a href="projetos.html#doacoes">
                            Doações
                        </a>

                        <a href="projetos.html#voluntariado">
                            Voluntariado
                        </a>

                    </div>

                </div>

                <a href="cadastro.html">
                    Cadastro
                </a>

                <a href="index.html#contato">
                    Contato
                </a>

            </div>

        </nav>

    </header>


    <!-- CONTEÚDO -->
    <main>

        <section>

            <h2>Cadastro</h2>

            <p>
                Preencha seus dados para participar
                das ações da ONG Esperança.
            </p>


            <!-- FORMULÁRIO -->
            <form id="cadastroForm">

                <!-- DADOS PESSOAIS -->
                <fieldset>

                    <legend>
                        Dados pessoais
                    </legend>


                    <label for="nome">
                        Nome completo:
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        required
                        minlength="3">


                    <label for="cpf">
                        CPF:
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}-?[0-9]{2}"
                        required>


                    <label for="nascimento">
                        Data de nascimento:
                    </label>

                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        required>

                </fieldset>


                <!-- CONTATO -->
                <fieldset>

                    <legend>
                        Informações de contato
                    </legend>


                    <label for="email">
                        E-mail:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@email.com"
                        required>


                    <label for="telefone">
                        Telefone:
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(82) 99999-9999"
                        pattern="\(?[0-9]{2}\)?\s?[0-9]{4,5}-?[0-9]{4}"
                        required>

                </fieldset>


                <!-- ENDEREÇO -->
                <fieldset>

                    <legend>
                        Endereço
                    </legend>


                    <label for="cep">
                        CEP:
                    </label>

                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="00000-000"
                        pattern="[0-9]{5}-?[0-9]{3}"
                        required>


                    <label for="endereco">
                        Endereço:
                    </label>

                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        placeholder="Rua, número e complemento"
                        required>


                    <label for="cidade">
                        Cidade:
                    </label>

                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        placeholder="Digite sua cidade"
                        required>


                    <label for="estado">
                        Estado:
                    </label>

                    <select
                        id="estado"
                        name="estado"
                        required>

                        <option value="">
                            Selecione
                        </option>

                        <option value="AL">
                            Alagoas
                        </option>

                        <option value="PE">
                            Pernambuco
                        </option>

                        <option value="SE">
                            Sergipe
                        </option>

                        <option value="BA">
                            Bahia
                        </option>

                        <option value="PB">
                            Paraíba
                        </option>

                        <option value="RN">
                            Rio Grande do Norte
                        </option>

                    </select>

                </fieldset>


                <!-- BOTÃO -->
                <button type="submit">
                    Realizar cadastro
                </button>

            </form>

        </section>

    </main>


    <!-- RODAPÉ -->

        <p>

</body>
